name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: cd src && go vet ./...
      - name: build
        run: |
          chmod +x build.sh
          ./build.sh "${GITHUB_REF_NAME#v}"
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xrock.tar.gz
            dist/xrock-*.tar.gz
            dist/xrock-ui.zip
          generate_release_notes: true
